<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>Luma Todo</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/theme-graphite.css" />
    <link rel="stylesheet" href="src/palettes.css" />
    <link rel="stylesheet" href="src/cn-holidays.css" />
  </head>
  <body>
    <div class="resize-handle resize-edge resize-n" data-edge="n"></div>
    <div class="resize-handle resize-edge resize-e" data-edge="e"></div>
    <div class="resize-handle resize-edge resize-s" data-edge="s"></div>
    <div class="resize-handle resize-edge resize-w" data-edge="w"></div>
    <div class="resize-handle resize-corner resize-nw" data-edge="nw"></div>
    <div class="resize-handle resize-corner resize-ne" data-edge="ne"></div>
    <div class="resize-handle resize-corner resize-se" data-edge="se"></div>
    <div class="resize-handle resize-corner resize-sw" data-edge="sw"></div>
    <main id="app" class="app-shell">
      <section id="calendarPanel" class="calendar-panel panel" aria-hidden="true">
        <header class="calendar-header drag-region">
          <div>
            <p class="eyebrow">计划与时间节点</p>
            <h2 id="monthTitle">2026 年 9 月</h2>
            <p id="monthLunar" class="month-lunar"></p>
          </div>
          <div class="month-controls no-drag">
            <button id="prevMonth" class="icon-button" aria-label="上个月"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="todayMonth" class="soft-button">今天</button>
            <button id="nextMonth" class="icon-button" aria-label="下个月"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </header>
        <div class="weekdays" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>
      <section class="todo-panel panel"></section>
    </main>
    <script src="src/appearance.js"></script>
    <script src="src/appearance-boot.js"></script>
    <script src="src/lifelog-boot.js"></script>
    <script src="src/cn-holidays.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
